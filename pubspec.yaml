name: ulsync
description: Entity-level last-write-wins synchronization client for Flutter apps.
version: 0.1.0
# Working name only; publication on pub.dev is a later-round decision.
publish_to: none
repository: https://github.com/ValeriusGC/ulsync-dart

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart embedded store: mobile, desktop and browser from one codebase.
  sembast: ^3.8.9
  # Browser implementation, selected by the conditional export in
  # lib/src/store/platform/. Safe for mobile-only applications: its entry point
  # is a conditional export that resolves to a stub off the web, and it carries
  # no native code.
  sembast_web: ^2.4.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
