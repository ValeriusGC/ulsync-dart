include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: warning
  exclude:
    - build/**
    # Nested app; CI analyzes it from example/. It still constructs
    # UlsyncClient with a public store until it migrates to open(name:).
    - example/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - public_member_api_docs
    - unawaited_futures
